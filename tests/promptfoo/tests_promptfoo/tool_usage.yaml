  vars:
    mensagem: Quanto custa a pipoca de Caramelo Clássico nos diferentes tamanhos?
    espera_ferramenta: true
    ferramenta_esperada:
    - base-pop-e-doce___Retrieve
  assert:
  - type: javascript
    value: "const ferramentas =\n  context.providerResponse?.metadata?.ferramentas;\n\nconst esperadoOriginal = context.vars.ferramenta_esperada;\n\
      const deveUsar = context.vars.espera_ferramenta === true ||\n                 context.vars.espera_ferramenta === \"\
      true\";\n\nconst esperadas = Array.isArray(esperadoOriginal)\n  ? esperadoOriginal\n  : esperadoOriginal\n    ? [esperadoOriginal]\n\
      \    : [];\n\nif (!Array.isArray(ferramentas)) {\n  return {\n    pass: false,\n    score: 0,\n    reason: \"Campo ferramentas\
      \ ausente ou inválido.\"\n  };\n}\n\nconst executadas = ferramentas.map(f => f.ferramenta);\n\nconst passou = deveUsar\n\
      \  ? esperadas.length > 0 &&\n    esperadas.every(nome => executadas.includes(nome))\n  : executadas.length === 0;\n\
      \nreturn {\n  pass: passou,\n  score: passou ? 1 : 0,\n  reason: JSON.stringify({\n    deveUsar,\n    ferramentasEsperadas:\
      \ esperadas,\n    ferramentasExecutadas: executadas,\n    resultado: passou ? \"PASS\" : \"FAIL\"\n  })\n};"
